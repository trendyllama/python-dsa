
name: Python application

on:
  - push

env:
  PYTHON_VERSION: "3.13"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync
    - name: Check formatting with ruff format
      run: uv run ruff format --check
    - name: Lint with ruff check
      run: uv run ruff check
    - name: Type check with ty
      run: uv run ty check

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/tutorial_app/client/package-lock.json
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync
    - name: Build frontend
      working-directory: src/tutorial_app/client
      run: |
        npm ci
        npm run build
    - name: Build package
      run: uv build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv python pin ${{ env.PYTHON_VERSION }}
        uv sync
    - name: Install built package
      run: |
        python -m pip install --upgrade pip
        pip install dist/*.whl
    - name: Run tests with pytest
      run: uv run pytest
